name: Checks and release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual release support - consolidated here to work with npm trusted publishing
  # npm only allows ONE workflow file as trusted publisher, so all publishing
  # must go through this workflow (release.yml)
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changeset-pr
      bump_type:
        description: 'Manual release type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Manual release description (optional)'
        required: false
        type: string

# Least-privilege default; the publishing jobs escalate individually.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git (avoids the default-branch hint).
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Concurrency is per job, not per workflow: a workflow-level group cancelled
# whole main runs mid-release. Check jobs cancel superseded pull request runs;
# jobs that write to main share one queue and never cancel (issue #59).

jobs:
  # === DETECT CHANGES - decides which pull request checks can be skipped ===
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name != 'workflow_dispatch'
    outputs:
      js-changed: ${{ steps.changes.outputs.js-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: changes
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/detect-code-changes.mjs

  # === VERSION CHANGE CHECK - versions are bumped only by the release job ===
  version-check:
    name: Check for Manual Version Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-version-check
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for version changes in package.json
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-version.mjs

  # === CHANGESET CHECK - only pull requests that change code need one ===
  changeset-check:
    name: Check for Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changeset-check
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changesets
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Automated version PRs carry no changeset by design
          if [[ "$GITHUB_HEAD_REF" == changeset-release/* ]]; then
            echo "Skipping changeset check for automated release PR"
            exit 0
          fi
          # Validates that exactly ONE changeset was ADDED by this PR;
          # pre-existing changesets from other merged PRs are ignored
          node scripts/validate-changeset.mjs

  # === LINT AND FORMAT CHECK ===
  # Runs independently of changeset-check so a missing changeset never hides
  # lint results (hive-mind CI/CD principle #5).
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes]
    if: |
      !cancelled() &&
      (
        github.event_name != 'pull_request' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.any-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh

      # secretlint 13 requires Node >=22; the image's default Node may be older.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      # Runs before `bun install` on purpose: this package depends on
      # @secretlint/secretlint-rule-preset-recommend (through
      # sensitive-data-sanitizer), and npm exec skips installing a requested
      # package that already sits in ./node_modules. secretlint then resolves
      # the preset from its own npx folder and fails with "is not found"
      # (issue #59, experiments/issue-59-secretlint-npx-local-dep.sh).
      - name: Check for secrets
        run: npx --yes -p secretlint@13.0.7 -p @secretlint/secretlint-rule-preset-recommend@13.0.7 secretlint "**/*"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exercise versioning without credentials so a malformed changeset
      # fails the pull request instead of the release on main. Restore the
      # consumed changesets so lint checks the merge, not release files.
      - name: Dry-run release versioning (PR only)
        if: github.event_name == 'pull_request'
        run: |
          trap 'git restore --source=HEAD --staged --worktree -- .' EXIT
          bun run changeset:version
          git status --short

      - name: Run ESLint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check file size limit
        run: bun run check:file-size

      - name: Check required documentation sections
        run: bun run check:docs

  # Test matrix: Bun on 3 pinned OS images (Ubuntu, macOS, Windows).
  # Tests validate the actual merge result, not a stale merge preview.
  test:
    name: Test (Bun on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Backstop only: the suite budget below expires first, so an overrun
    # fails the step instead of turning the job grey (cancelled).
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes, changeset-check, lint]
    # !cancelled() instead of always() so cancellation propagates.
    if: |
      !cancelled() &&
      (
        github.event_name == 'push' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.release_mode == 'instant'
        )
      ) &&
      (needs.changeset-check.result == 'success' || needs.changeset-check.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: bash scripts/simulate-fresh-merge.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        shell: bash
        # --timeout caps each test at 30s (Bun's 5s default flaked on cold
        # Windows runners); the suite budget bounds the whole run.
        run: bash scripts/run-with-budget-warning.sh 360 "Bun test suite" bun test --timeout 30000

  # Prove npm can accept the release before versioning consumes changesets.
  # Release mode (push to main, instant release) fails with an annotation
  # naming the owner action; report mode (pull requests) only warns.
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-release-preflight
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify npm package bootstrap
        env:
          NPM_PREFLIGHT_MODE: >-
            ${{
              (
                (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant')
              ) && 'release' || 'report'
            }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: node scripts/check-npm-publishing.mjs

  # Release - only runs on main after every check passes (push events)
  release:
    name: Release
    needs:
      [
        detect-changes,
        version-check,
        changeset-check,
        lint,
        test,
        release-preflight,
      ]
    timeout-minutes: 45
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.release-preflight.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    # Permissions required for npm OIDC trusted publishing
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Keeps credentials in .git/config: version-and-commit.mjs pushes the
      # version commit to main. Every other checkout sets
      # persist-credentials: false.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove deprecated npm auth config
        run: node scripts/sanitize-npm-userconfig.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update npm for OIDC trusted publishing
        run: bun scripts/setup-npm.mjs

      - name: Check for changesets
        id: check_changesets
        run: |
          # Count changeset files (excluding README.md and config.json)
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "Found $CHANGESET_COUNT changeset file(s)"
          if [[ "$CHANGESET_COUNT" -gt 0 ]]; then HAS=true; else HAS=false; fi
          {
            echo "has_changesets=$HAS"
            echo "changeset_count=$CHANGESET_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Merge multiple changesets
        if: steps.check_changesets.outputs.has_changesets == 'true' && steps.check_changesets.outputs.changeset_count > 1
        run: |
          echo "Multiple changesets detected, merging..."
          bun scripts/merge-changesets.mjs

      - name: Version packages and commit to main
        if: steps.check_changesets.outputs.has_changesets == 'true'
        id: version
        run: bun scripts/version-and-commit.mjs --mode changeset

      - name: Publish to npm
        # Run if version was committed OR if a previous attempt already committed (for re-runs)
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        # Optional NPM_TOKEN bootstrap: OIDC trusted publishing cannot create
        # a brand-new package (the first publish returns E404). With the
        # secret set, the first publish succeeds; afterwards configure the
        # trusted publisher and delete the secret. See docs/npm-publishing.md.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-to-npm.mjs --should-pull

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
        run: bun scripts/create-github-release.mjs --release-version "$PACKAGE_VERSION" --repository "$REPOSITORY"

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/format-github-release.mjs --release-version "$PACKAGE_VERSION" --repository "$REPOSITORY" --commit-sha "$COMMIT_SHA"

  # Manual Instant Release - triggered via workflow_dispatch with instant mode
  # This job is in release.yml because npm trusted publishing
  # only allows one workflow file to be registered as a trusted publisher
  instant-release:
    name: Instant Release
    # Publishing waits for the same quality gates as the automated release.
    needs:
      [
        detect-changes,
        version-check,
        changeset-check,
        lint,
        test,
        release-preflight,
      ]
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.release-preflight.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    # Permissions required for npm OIDC trusted publishing
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Keeps credentials in .git/config: version-and-commit.mjs pushes the
      # version commit to main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove deprecated npm auth config
        run: node scripts/sanitize-npm-userconfig.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update npm for OIDC trusted publishing
        run: bun scripts/setup-npm.mjs

      - name: Version packages and commit to main
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: bun scripts/version-and-commit.mjs --mode instant --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"

      - name: Publish to npm
        # Run if version was committed OR if a previous attempt already committed (for re-runs)
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        # Optional NPM_TOKEN bootstrap; see the release job above.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-to-npm.mjs

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
        run: bun scripts/create-github-release.mjs --release-version "$PACKAGE_VERSION" --repository "$REPOSITORY"

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/format-github-release.mjs --release-version "$PACKAGE_VERSION" --repository "$REPOSITORY" --commit-sha "$COMMIT_SHA"

  # Manual Changeset PR - creates a pull request with the changeset for review
  changeset-pr:
    name: Create Changeset PR
    # PR creation does not publish, but it must still pass the fast lint gate.
    needs: [lint]
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'changeset-pr' &&
      needs.lint.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # create-pull-request receives the token directly; nothing else needs
      # a credential in .git/config.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release pull-request token
        env:
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
        run: |
          if [[ "$HAS_RELEASE_PR_TOKEN" != "true" ]]; then
            echo "::warning title=RELEASE_PR_TOKEN not configured::The changeset PR is created with GITHUB_TOKEN, and GitHub does not start pull_request workflows for it. Close and reopen the PR (or push to it) to run CI, or add a RELEASE_PR_TOKEN secret (fine-grained PAT with contents and pull-requests write)."
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create changeset file
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: bun scripts/create-manual-changeset.mjs --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for manual ${{ github.event.inputs.bump_type }} release'
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changeset in this PR
            2. Merge this PR to main
            3. The release workflow on main versions, publishes to npm and creates a GitHub release

  # The single required check. GitHub reports jobs killed by timeout-minutes
  # as cancelled, not failed; this gate observes every job and excuses only
  # cancellations caused by a newer commit superseding this run. needs is
  # derived and checked by the status-gate-coverage job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - detect-changes
      - version-check
      - changeset-check
      - lint
      - test
      - release-preflight
      - release
      - instant-release
      - changeset-pr
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
